# Census sources: browser versions whose menus and command tables were read from open source code.
#
# `ref` is the branch or tag a commit was resolved from; `commit` is what was actually read.
# Fill in `commit` with:  npm run census -- pin
# `released` is the release year of that version. It is NOT derived from the source: it is
# common knowledge, so check it against the project's release notes before relying on it.
#
# Closed-source browsers (Internet Explorer, Opera Presto, Safari, Vivaldi, Netscape 4, Arc) cannot
# be read this way. They are listed in docs/CENSUS.md as not yet covered.
# Brave's own ids are mostly vendor services (rewards, wallet, assistant): few link to canonical commands, by design.
# ---- Scanned manuals at the Internet Archive (host: archive.org; `repo` is the item identifier) ----
# These are books ABOUT a browser, read by OCR: weaker evidence than source code, and shown as "manual".
# Only freely readable items are used (not the lending library). There is no commit; the text hash is the pin.
# ---- Re-creations and engines of closed-source browsers (their own code is not available) ----
# Wine's ieframe.dll is a re-implementation of Internet Explorer: evidence of the menu Wine copied, not of IE itself.
# Safari's page context menu items are defined in WebKit, which Apple publishes. WebKit 533.16 shipped in Safari 5.0.
# ---- Screenshot transcriptions (host: local; repo: the Wikimedia Commons file name) ----

