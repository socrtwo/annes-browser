# Third batch: keyboard-driven browsers. Vimium's and qutebrowser's names are camelCase and
# kebab-case versions of the same words, so they normalize alike. Names that mean something
# different in one of the sources are settled in overrides.yaml instead.

view.scroll-top: [scrolltotop, begin]
view.scroll-bottom: [scrolltobottom, end]
view.scroll-page-down: [scrollfullpagedown, nextpage, pagedown]
view.scroll-page-up: [scrollfullpageup, prevpage, pageup]
view.scroll-far-left: [scrolltoleft]
view.scroll-far-right: [scrolltoright]
view.scroll-percent: [scrolltoperc]
view.zoom-set: [setzoom, zoom]
view.page-source: [toggleviewsource]

nav.up-to-root: [gotoroot]
nav.next-page: [gonext]
nav.previous-page: [goprevious]

file.open-location: [vomnibaractivate]
file.open-location-new-tab: [vomnibaractivateinnewtab]
file.edit-url: [vomnibaractivateediturl, vomnibaractivateediturlinnewtab, editurl]
file.save-link: [download]

edit.copy-page-url: [copycurrenturl]
edit.paste-and-go: [opencopiedurlincurrenttab]
edit.find: [enterfindmode]
edit.find-next: [performfind]
edit.find-previous: [performbackwardsfind]
edit.find-selection: [findselected]
edit.find-selection-back: [findselectedbackwards]

tab.new: [createtab]
tab.previous: [previoustab]
tab.close: [removetab]
tab.close-others: [tabonly]
tab.close-left: [closetabsonleft]
tab.close-to-end: [closetabsonright]
tab.duplicate: [tabclone]
tab.select: [tabselect, tabfocus]
tab.select-first: [firsttab]
tab.select-last: [lasttab]
tab.visit-previous: [visitprevioustab]
tab.pin: [togglepintab, tabpin]
tab.mute: [togglemutetab, tabmute]
tab.move-left: [movetableft]
tab.move-right: [movetabright]
tab.move-to-new-window: [tabgive]
tab.open-copied-url: [opencopiedurlinnewtab]
tab.search: [vomnibaractivatetabselection]
app.close-other-windows: [windowonly]

bookmark.toggle: [bookmarkadd]
bookmark.remove: [bookmarkdel]
bookmark.show: [bookmarklist]
bookmark.quick-add: [quickmarkadd, quickmarksave]
bookmark.quick-open: [quickmarkload]
bookmark.quick-delete: [quickmarkdel]

history.clear: [historyclear]
history.save-session: [sessionsave]
history.load-session: [sessionload]
history.delete-session: [sessiondelete]

tools.take-screenshot: [screenshot]
tools.downloads-clear: [downloadclear]
tools.download-dismiss: [downloadremove, downloadcancel]
tools.download-open: [downloadopen]
tools.download-retry: [downloadretry]
tools.download-delete: [downloaddelete]
tools.run-external: [spawn]
tools.run-javascript: [jseval]
tools.macro-record: [macrorecord]
tools.macro-run: [macrorun]
app.command-palette: [vomnibaractivatecommandselection]
app.restart: [restart]

help.contents: [showhelp, help]
help.feedback: [report]
help.about: [version]

input.insert-mode: [enterinsertmode]
input.caret-mode: [entervisualmode, selectiontoggle]
input.pass-next-key: [passnextkey]
input.focus-input: [focusinput]
input.hints-open: [linkhintsactivatemode, hint]
input.hints-new-tab: [linkhintsactivatemodetoopeninnewtab]
input.hints-new-tab-foreground: [linkhintsactivatemodetoopeninnewforegroundtab]
input.hints-multiple: [linkhintsactivatemodewithqueue]
input.hints-download: [linkhintsactivatemodetodownloadlink]
input.hints-private: [linkhintsactivatemodetoopenincognito]
input.hints-copy-link: [linkhintsactivatemodetocopylinkurl]
input.set-mark: [marksactivatecreatemode, setmark]
input.jump-mark: [marksactivategotomode, jumpmark, gotomark]
