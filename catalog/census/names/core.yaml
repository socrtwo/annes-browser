# For each command: the normalized names (lower-case letters and digits only) under which browsers
# in catalog/census/ offered it. Derived from item keys and labels by tools/census/names.ts:
#   IDC_NEW_TAB -> newtab, "Open Link in New Tab" -> openlinkinnewtab, File/NewTab -> newtab.
# A name may belong to only one command; settle single ambiguous items in overrides.yaml.
# Names are added after reading the item's key and the source's own description. Nothing is guessed:
# when a name is unclear it stays unmatched and appears in docs/CENSUS.md.

