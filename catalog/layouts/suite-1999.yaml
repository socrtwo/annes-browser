id: suite-1999
label: 1999 Suite
description: The communicator-suite arrangement, with editing and component menus.
menus:
  - label: File
    items:
      - label: New
        items: [app.new-window, app.new-private-window, tab.new]
      - file.open-location
      - file.open-file
      - file.save-page-as
      - { separator: true }
      - page.edit-in-composer
      - { separator: true }
      - file.print
      - { separator: true }
      - tab.close
      - app.quit
