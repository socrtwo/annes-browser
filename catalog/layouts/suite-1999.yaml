    items: [view.zoom-in, view.zoom-out, { separator: true }, nav.reload, nav.stop, { separator: true }, view.page-source, page.info, view.full-screen]
  - label: Go
    items: [nav.back, nav.forward, nav.home, { separator: true }, history.show]
