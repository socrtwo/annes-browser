# Reads browsers' menu bars on GitHub's macOS machines (fresh machines: no history or bookmarks)
# and prints each as a census transcription. See docs/MENU-DUMPS.md.
name: macOS browser menus

on:
  workflow_dispatch:
  push:
    branches: [claude/annes-browser-repo-setup-orq4f7]
    paths: ['.github/workflows/safari-menus.yml', 'tools/menu-dump/macos-menus.js']

permissions:
  contents: read

jobs:
  dump:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: Opera, cask: opera, bundle: Opera }
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install
        if: matrix.cask != ''
        run: |
          brew install --cask ${{ matrix.cask }}
          xattr -dr com.apple.quarantine "/Applications/${{ matrix.bundle }}.app" || true
      - name: Versions
        run: |
          sw_vers
          defaults read "/Applications/${{ matrix.bundle }}.app/Contents/Info" CFBundleShortVersionString
          defaults read "/Applications/${{ matrix.bundle }}.app/Contents/Info" CFBundleVersion || true
          shasum -a 256 "/Applications/${{ matrix.bundle }}.app/Contents/Info.plist"
      - name: Start
        run: |
          open "/Applications/${{ matrix.bundle }}.app"
          sleep 40
          pgrep -fl "${{ matrix.bundle }}" | head -3
      - name: Read menus
        run: |
          osascript -l JavaScript tools/menu-dump/macos-menus.js "${{ matrix.app }}" > menus.txt
          wc -l menus.txt
          echo "=====BEGIN DUMP====="
          cat menus.txt
          echo "=====END DUMP====="
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menus-${{ matrix.cask || 'safari' }}
          path: menus.txt
